components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode:
          description: ステータスコード
          type: integer
          example: 404
        title:
          description: エラー説明
          type: string
          example: Resource not found
        detail:
          description: エラー詳細
          type: string
          example: Target UUID is not found
